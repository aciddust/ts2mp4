[package]
name = "ts2mp4"
version = "0.4.0"
edition = "2021"
description = "A library and CLI tool for converting MPEG-TS files to MP4 format"
license = "MIT"
repository = "https://github.com/aciddust/ts2mp4"
homepage = "https://github.com/aciddust/ts2mp4"
documentation = "https://docs.rs/ts2mp4"
keywords = ["ts", "mp4", "mpeg", "video", "converter"]
categories = ["multimedia::video", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# 파이썬 바인딩 전용. 기본 빌드에는 들어가지 않는다.
# extension-module 은 여기서 켜지 않는다. 켜면 libpython 을 링크하지 않아
# cargo test 가 링크 단계에서 깨진다. 휠을 만들 때만 pyproject.toml 이 켠다.
pyo3 = { version = "0.29", features = ["abi3-py39"], optional = true }

[features]
# 파이썬 확장 모듈로 빌드할 때만 켠다.
python = ["dep:pyo3"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ts2mp4"
path = "src/main.rs"
